[package]
name = "termust"
version = "0.1.0"
description = "Termust desktop SSH client (technical spike)"
authors = ["Termust Project"]
license = "MIT OR Apache-2.0"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "termust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dev-dependencies]
# The `test` feature adds Tauri's mock runtime, which lets the tests drive the
# real command handlers instead of a copy of them.
tauri = { version = "2.12.3", features = ["test"] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.3", features = [] }
# `ring` instead of the default `aws-lc-rs`: it drops the cmake/NASM build
# requirement, which keeps the toolchain small on macOS, Linux and Windows.
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1.53.3", features = ["sync", "time", "net", "io-util", "macros", "rt-multi-thread"] }
base64 = "0.23.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
argon2 = { version = "0.6.0", default-features = false }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
# `serde` lets `Zeroizing<String>` be the secret field in a payload: it serialises
# like a plain string but wipes its bytes when the record is dropped.
zeroize = { version = "1.9.1", features = ["serde"] }
uuid = { version = "1.28.0", features = ["v4"] }
getrandom = "0.4.3"
# The official Tauri v2 dialog plugin: the native open/save dialog for choosing
# a backup file. It only returns a path to the frontend; the backend does the
# file work. No filesystem plugin is installed, so the webview cannot read or
# write anything on its own.
tauri-plugin-dialog = "2"
# Publishing a backup file as a whole file or not at all: `NamedTempFile` does
# the temporary-file lifecycle, and both `persist` (replace) and
# `persist_noclobber` (never replace) use the atomic move each platform really
# has, including the Windows case where `std::fs::rename` refuses to replace.
tempfile = "3"
# The digest that binds a preview to the file a restore really reads.
sha2 = "0.10"
